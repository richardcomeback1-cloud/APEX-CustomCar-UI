<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>APEX Custom Car</title>
    <link rel="stylesheet" href="css/style_img.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="display_mech">
      <!-- Stats Panel - Left Side -->
      <div class="mech_stat_area" id="detailCard">
        <div>
          <div class="stat_01">
            <div class="stat_parameter">
              <p>การเร่งความเร็ว</p>
            </div>
            <div class="stat_prog acc_1"></div>
          </div>
          <div class="stat_01">
            <div class="stat_parameter">
              <p>ความเร็วสูงสุด</p>
            </div>
            <div class="stat_prog spd_1"></div>
          </div>
          <div class="stat_01">
            <div class="stat_parameter">
              <p>การเบรก</p>
            </div>
            <div class="stat_prog brk_1"></div>
          </div>
          <div class="stat_01">
            <div class="stat_parameter">
              <p>แรงม้า</p>
            </div>
            <div class="stat_prog sus_1"></div>
          </div>
        </div>
      </div>

      <!-- Key Bindings - Bottom Left -->
      <div class="mech_key_area">
        <div>
          <div class="press_01">
            <p>
              <iconify-icon icon="icon-park-solid:arrow-keys"></iconify-icon>
            </p>
            <p>เลือกเมนู</p>
          </div>
          <div class="press_01">
            <p>ENTER</p>
            <p>ยืนยัน</p>
          </div>
          <div class="press_01">
            <p>BACKSPACE</p>
            <p>กลับ</p>
          </div>
          <div class="press_01">
            <p>C</p>
            <p>หมุนมุมกล้อง</p>
          </div>
          <div class="press_01">
            <p>G</p>
            <p>เปิด / ปิดข้อมูล</p>
          </div>
          <div class="press_01">
            <p>ESC</p>
            <p>ออกจากเมนู</p>
          </div>
        </div>
      </div>

      <div class="container_mech">
        <!-- Vehicle Title - Top Left -->
        <div class="vehicle_title">
          <div>
            <p class="veh_name" id="detailCard_name">GAUNTLET5</p>
            <p id="class_name">SUPERCAR</p>
          </div>
        </div>

        <!-- Cash Display - Top Right -->
        <div class="my_cash">
          <div>
            <p id="cash">$129,250,000</p>
            <p>จำนวนเงินสดของคุณ</p>
          </div>
        </div>

        <!-- Color Picker Panel -->
        <div class="mech_color_palette" id="colorPicker-holder">
          <div>
            <div class="mech_color_title">
              <p id="colorPicker-title">สีหลักตัวรถ</p>
              <p id="colorPicker-price">$1500</p>
            </div>
            <div class="mech_ct_palette" id="colorPicker-container"></div>
          </div>
        </div>

        <!-- Main Menu Area - Bottom Center -->
        <div class="mech_main_area">
          <div class="mech_menu">
            <div class="mech_title">
              <div class="mech_path">
                <p class="title_show">WHEELS</p>
              </div>
            </div>
            <div class="mech_page_number">
              <p>1/5</p>
            </div>
          </div>

          <div class="mech_list_content" id="scroll-container"></div>
        </div>
      </div>
    </div>

    <script src="nui://game/ui/jquery.js"></script>
    <script src="js/iconify-icon.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
